# Cloudflare Workers (static assets) deploy for this Astro example.
#
#   build   — always runs (push + PR): install, typecheck (`astro check`),
#             build (`astro build`). Needs no Cloudflare credentials, so a
#             fresh clone or a fork is green immediately. This is the real
#             correctness gate.
#   browser — always runs (push to `main` + every PR) and is blocking: a
#             change-detection step decides whether the Playwright suite runs.
#             Content-only changes log "skipped: content-only" and pass;
#             otherwise it boots the real Astro dev server + zdtp-server
#             sidecar and fails whenever the suite fails (including a server
#             or sidecar that does not start). Needs no credentials.
#   deploy  — push to `main` only: `wrangler deploy` (uploads the Worker AND
#             attaches the custom domain from wrangler.toml).
#   preview — non-draft pull requests only: uploads a preview version, asserts the
#             preview actually serves real content, and comments its URL on
#             the PR. Uses `wrangler versions upload`, which does NOT touch
#             routes, so previews never publish to the custom domain.
#
# Both credentialed jobs SELF-SKIP when either secrets.CLOUDFLARE_API_TOKEN or
# secrets.CLOUDFLARE_ACCOUNT_ID is unset, so the repo is not red-by-design
# before Cloudflare is wired up (and so fork PRs, which never receive secrets,
# stay green).
#
# Enable deploys by adding, in repo Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token with Account · Workers Scripts: Edit,
#                          Account · Account Settings: Read, and
#                          Zone · Workers Routes + DNS: Edit on zudolab.dev
#                          (required by the custom domain)
#   CLOUDFLARE_ACCOUNT_ID  target Cloudflare account id
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review re-runs CI so the draft-gated preview job runs once a
    # draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: deploy-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a production deploy midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (typecheck + astro build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify wrangler CLI
        run: pnpm exec wrangler --version

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  browser:
    name: Browser (Playwright + real Apply)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the change-detection diff can reach the base.
          fetch-depth: 0

      - name: Detect browser-relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE_SHA}...${PUSH_SHA}"
          else
            echo "No comparable base for this push — running the suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$range")
          echo "Changed files ($range):"
          printf '%s\n' "$changed"
          relevant=$(printf '%s\n' "$changed" | bash scripts/browser-relevant-changes.sh)
          if [ -n "$relevant" ]; then
            echo "Browser-relevant changes:"
            printf '%s\n' "$relevant"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped: content-only"
            echo "::notice::Browser suite skipped: content-only change."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.changes.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Record toolchain versions
        if: steps.changes.outputs.run == 'true'
        run: |
          echo "Node $(node --version)"
          echo "pnpm $(pnpm --version)"
          pnpm exec playwright --version
          node -e "import('@playwright/test').then(async ({ chromium }) => { const b = await chromium.launch(); console.log('Chromium ' + b.version()); await b.close(); })"

      # Playwright's webServer boots `_dev:astro` and `_dev:tokens-bin` (the
      # two halves of `pnpm dev`); CI=true disables server reuse, and
      # tests/e2e/global-setup.ts verifies both listeners are this checkout's.
      - name: Run browser suite
        if: steps.changes.outputs.run == 'true'
        run: pnpm test:e2e

      # Supplementary to the spec's own byte-exact restore assertion.
      - name: Assert tokens.css is unchanged after the suite
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        run: git diff --exit-code -- src/styles/tokens.css

      - name: Upload Playwright report
        if: ${{ failure() && steps.changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not set — skipping deploy. Add both in repo Settings to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  preview:
    name: Preview deploy
    needs: build
    # Draft validation must not publish a preview. Fork PRs never receive
    # repository secrets, so a preview could only fail there. Skip the job
    # outright rather than letting it run and self-skip.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          # Fork PRs never receive secrets, so this is also the fork guard.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not available (unset, or this is a fork PR) — skipping preview deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload preview version
        id: preview
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Machine-readable NDJSON record of what wrangler did. The account's
          # workers.dev subdomain is not known here, so the preview URL cannot be
          # templated — and scraping the human-readable stdout is brittle. This
          # file is the interface wrangler provides for CI.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          pnpm exec wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "Preview for PR #${PR_NUMBER}"

          # `tail -n 1`, not `head -1`: under the runner's default `bash -eo
          # pipefail`, head closing the pipe early can SIGPIPE jq and fail the
          # step with 141. The guard keeps a missing output file on the
          # soft-skip path below instead of hard-failing on jq's read error.
          PREVIEW_URL=""
          if [ -s "$WRANGLER_OUTPUT_FILE_PATH" ]; then
            PREVIEW_URL=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' \
              "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          fi

          if [ -z "$PREVIEW_URL" ]; then
            # Preview URLs additionally require the account to have a workers.dev
            # subdomain with preview routing enabled (see wrangler.toml).
            echo "::notice::Preview version uploaded, but no preview URL was reported — skipping the content check and PR comment."
          fi
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      # This cannot validate the custom domain — a preview never touches
      # routes — but it is the only pre-merge evidence that the Worker and its
      # assets actually serve. The marker string is the page <title> set in
      # src/pages/index.astro, so it only appears once the build is served.
      - name: Assert preview serves real content
        if: steps.preview.outputs.preview_url != ''
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          # A just-created preview alias can 404 / return edge errors for a few
          # seconds while it propagates, so retry rather than fail the PR check.
          body=$(curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "$PREVIEW_URL")
          if ! grep -q "Astro Example — Design Token Panel" <<< "$body"; then
            echo "::error::Preview URL did not return expected content marker."
            exit 1
          fi
          echo "Preview content marker found."

      - name: Comment preview URL on the PR
        if: steps.preview.outputs.preview_url != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const marker = '<!-- cf-preview-branch -->';
            const body = `${marker}\n### Preview deployed\n\nThis PR is live at: ${previewUrl}\n\n_Updated for commit \`${context.sha.substring(0, 7)}\`._`;

            // Paginate — with the default page size an older marker comment on a
            // long PR would be missed and a duplicate posted every run.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
